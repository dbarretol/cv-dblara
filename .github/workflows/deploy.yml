# Builds the site (Astro + PDF), deploys it to Cloudflare Pages and replaces the old GitHub Pages address
# with a redirect to the new one.
# Pull requests only build (no deploy) so problems show up before merging.
#
# Requires:
# - Cloudflare Pages project "cv-davidbarretolara" (Direct Upload).
# - Environment "cloudflare-pages" (restricted to main) with secrets CLOUDFLARE_API_TOKEN (permission:
#   Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
# - Settings > Pages > Source = "GitHub Actions" (for the redirect).
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  # Monthly rebuild (day 1, 11:00 UTC = 06:00 in Lima) so expired certifications move to "Certificaciones anteriores"
  # without a commit (see src/lib/cv.ts). GitHub disables scheduled workflows after 60 days without activity.
  schedule:
    - cron: '0 11 1 * *'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_PROJECT: cv-davidbarretolara
  SITE_URL: https://cv-davidbarretolara.pages.dev
  BASE_PATH: /

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The runner image already includes Google Chrome; using it avoids downloading Chromium and its
      # system packages on every run (an apt mirror stall once kept this step hanging for minutes).
      PDF_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (type check, site, PDF, post-build checks)
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build the redirect for the old address
        run: node scripts/build-redirect.mjs

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PROJECT }} --branch=main --commit-dirty=true

  # Runs only after the new site is live, so the old address never points to a missing site.
  redirect-old-address:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
